name: Semantic Release

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jannesstroehlein/authentik-openldap-outpost


jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Python Semantic Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          
          # Ensure we are on the branch, not detached HEAD
          git checkout main
          
          # 1. Bump version, update changelog, commit, tag, and build (via 'uv build')
          uvx --from python-semantic-release==10.5.3 semantic-release version
          
          # 2. Push the version bump commit and tag back to the repo
          git push origin main --follow-tags
          
          # 3. Create GitHub Release from tag
          uvx --from python-semantic-release==10.5.3 semantic-release publish

          # 4. Check if a new version was released by comparing tags
          NEW_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$NEW_VERSION" ]; then
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=${NEW_VERSION#v}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        if: steps.release.outputs.released == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.release.outputs.released == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}